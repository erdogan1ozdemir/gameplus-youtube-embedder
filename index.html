<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temiz HTML ↔ Rich Text Dönüştürücü</title>
    <style>
        :root {
            --primary-color: #00ff88;
            --secondary-color: #00cc6a;
            --dark-bg-1: #0a0a0a;
            --dark-bg-2: #1a1a1a;
            --dark-bg-3: #2d2d2d;
            --text-light: #ffffff;
            --text-dark: #000000;
            --text-muted: #e0e0e0;
            --border-color: rgba(0, 255, 136, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg-1) 0%, var(--dark-bg-2) 50%, #0f2027 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 255, 136, 0.2);
        }

        .header h1 {
            color: var(--text-dark);
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(0,0,0,0.8);
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            font-weight: 500;
        }

        .converter-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: 500px;
        }

        .editor-panel {
            background: linear-gradient(135deg, var(--dark-bg-2) 0%, var(--dark-bg-3) 100%);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .editor-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--primary-color));
            border-radius: 20px 20px 0 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .copy-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: var(--text-dark);
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .copy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
        }

        .rich-text-toolbar {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px 10px 0 0;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: -1px;
        }

        .toolbar-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 35px;
        }

        .toolbar-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: var(--primary-color);
        }

        .toolbar-btn.active {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: var(--text-dark);
        }

        .toolbar-separator {
            width: 1px;
            background: var(--border-color);
            margin: 0 5px;
        }

        .rich-text-editor {
            width: 100%;
            flex: 1;
            min-height: 400px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 0 0 10px 10px;
            background: #f1f1f1; 
            color: #333; 
            font-size: 14px;
            line-height: 1.6;
            overflow: auto;
        }

        .rich-text-editor:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .rich-text-editor p { margin: 0.5em 0; }
        .rich-text-editor a { color: #0066cc; text-decoration: underline; }

        .html-editor {
            width: 100%;
            flex: 1;
            min-height: 400px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: #0e0e0e; 
            color: var(--text-muted);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            overflow: auto;
        }

        @media (max-width: 900px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Temiz HTML ↔ Rich Text Dönüştürücü</h1>
            <p>Zengin metinden temiz HTML'e ve YouTube linklerini gömülü oynatıcılara çevirin</p>
        </div>

        <div class="converter-section">
            <div class="editor-container">
                <div class="editor-panel">
                    <div class="panel-header">
                        <h3 class="panel-title"><span>📝</span> Zengin Metin Editörü</h3>
                        <button class="copy-btn" onclick="copyRichTextContent(event)">📋 Zengin Metni Kopyala</button>
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column;">
                        <div class="rich-text-toolbar">
                            <button class="toolbar-btn" data-command="bold" onclick="formatDoc('bold')" title="Kalın"><strong>B</strong></button>
                            <button class="toolbar-btn" data-command="italic" onclick="formatDoc('italic')" title="İtalik"><em>I</em></button>
                            <button class="toolbar-btn" data-command="underline" onclick="formatDoc('underline')" title="Altı Çizili"><u>U</u></button>
                            <div class="toolbar-separator"></div>
                            <button class="toolbar-btn" data-command="h1" onclick="toggleBlockFormat('h1')" title="Başlık 1">H1</button>
                            <button class="toolbar-btn" data-command="h2" onclick="toggleBlockFormat('h2')" title="Başlık 2">H2</button>
                            <button class="toolbar-btn" data-command="p" onclick="toggleBlockFormat('p')" title="Paragraf">P</button>
                            <div class="toolbar-separator"></div>
                            <button class="toolbar-btn" data-command="insertUnorderedList" onclick="formatDoc('insertUnorderedList')" title="Madde İşaretli Liste">•</button>
                            <button class="toolbar-btn" data-command="insertOrderedList" onclick="formatDoc('insertOrderedList')" title="Numaralı Liste">1.</button>
                            <div class="toolbar-separator"></div>
                            <button class="toolbar-btn" data-command="createLink" onclick="createLink()" title="Link Ekle">🔗</button>
                             <button class="toolbar-btn" data-command="removeFormat" onclick="formatDoc('removeFormat'); richTextToHtml();" title="Formatı Temizle">✕</button>
                        </div>
                        <div class="rich-text-editor" contenteditable="true" id="richtext-editor"></div>
                    </div>
                </div>

                <div class="editor-panel">
                    <div class="panel-header">
                        <h3 class="panel-title"><span>🏷️</span> Temiz HTML Kodu</h3>
                        <button class="copy-btn" onclick="copyHtmlOutput(event)">📋 HTML'i Kopyala</button>
                    </div>
                    <textarea class="html-editor" id="html-output-editor" placeholder="Temiz HTML kodunuz burada görünecek..." readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        const richTextEditor = document.getElementById('richtext-editor');
        const htmlOutputEditor = document.getElementById('html-output-editor');
        let debounceTimer;

        function extractYouTubeVideoId(url) {
            if (!url) return null;
            const patterns = [
                /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/|youtube\.com\/shorts\/)([^"&?\/\s]{11})/,
            ];
            for (let pattern of patterns) {
                const match = url.match(pattern);
                if (match && match[1]) return match[1];
            }
            return null;
        }

        function createYouTubeEmbedHTML(videoId) {
            return `<!-- Responsive YouTube Embed Başlangıcı -->
<div style="width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; border-radius: 12px; margin: 1em 0;"><iframe style="width: 100%; height: 100%; object-fit: contain; display: block; background: #000;" title="YouTube video player" src="https://www.youtube.com/embed/${videoId}" width="560" height="315" frameborder="0" allowfullscreen="allowfullscreen"></iframe></div>
<!-- Responsive YouTube Embed Sonu -->`;
        }
        
        function formatDoc(command, value = null) {
            document.execCommand(command, false, value);
            richTextEditor.focus();
            richTextToHtml(); 
        }

        function toggleBlockFormat(tag) {
            document.execCommand('formatBlock', false, `<${tag}>`);
            richTextToHtml(); 
        }
        
        function createLink() {
            const url = prompt('Link URL\'sini girin:', 'https://');
            if (url) formatDoc('createLink', url);
        }
        
        function cleanHtmlForOutput(inputHtml) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(`<body>${inputHtml}</body>`, 'text/html');
            const body = doc.body;

            function processNode(node) {
                Array.from(node.childNodes).forEach(processNode);
                
                if (node.nodeType !== Node.ELEMENT_NODE) return;

                const el = node;

                if (el.hasAttribute('style')) {
                    if (el.style.fontStyle === 'italic') {
                        const em = doc.createElement('em');
                        while (el.firstChild) em.appendChild(el.firstChild);
                        el.innerHTML = '';
                        el.appendChild(em);
                    }
                    if (el.style.fontWeight === 'bold' || parseInt(el.style.fontWeight, 10) >= 700) {
                         const strong = doc.createElement('strong');
                         while (el.firstChild) strong.appendChild(el.firstChild);
                         el.innerHTML = '';
                         el.appendChild(strong);
                    }
                }
                
                if (el.tagName === 'SPAN') {
                    while (el.firstChild) el.parentNode.insertBefore(el.firstChild, el);
                    el.remove();
                    return;
                }
                
                if (el.tagName === 'B') {
                    const strong = doc.createElement('strong');
                    while(el.firstChild) strong.appendChild(el.firstChild);
                    el.parentNode.replaceChild(strong, el);
                }
                if (el.tagName === 'I') {
                    const em = doc.createElement('em');
                    while(el.firstChild) em.appendChild(el.firstChild);
                    el.parentNode.replaceChild(em, el);
                }

                const allowedAttributes = { 'a': ['href', 'title'], 'img': ['src', 'alt', 'title'] };
                const attrsToRemove = Array.from(el.attributes)
                    .map(attr => attr.name.toLowerCase())
                    .filter(name => !(allowedAttributes[el.tagName.toLowerCase()]?.includes(name)));
                attrsToRemove.forEach(name => el.removeAttribute(name));
            }
            
            processNode(body);

            // Tablo yapısını normalize et: colgroup/col temizle, ilk satırı thead'e terfi ettir,
            // hücre içindeki gereksiz <p>/<strong> sarmalayıcılarını ve artık <br>'leri kaldır.
            normalizeTables(body, doc);

            // External link kuralları: target="_blank" + rel="nofollow noopener"
            normalizeLinks(body);

            // =====================================================
            // BUG FIX v3: Ardışık aynı türdeki listeleri birleştir.
            // Aralarında sadece paragraf (p, div) varsa birleştirir.
            // Heading (h1-h6) veya farklı yapısal elemanlara
            // rastladığında birleştirmeyi DURDURUR.
            // =====================================================
            mergeAdjacentLists(body);
            
            // Find paragraphs that are just a YouTube link and replace them with an embed
            body.querySelectorAll('p').forEach(p => {
                const text = p.textContent.trim();
                const videoId = extractYouTubeVideoId(text);
                if (videoId && text === p.innerText.trim()) {
                    const embedHtml = createYouTubeEmbedHTML(videoId);
                    const embedFragment = document.createRange().createContextualFragment(embedHtml);
                    p.parentNode.replaceChild(embedFragment, p);
                }
            });

            // Remove empty block elements
            body.querySelectorAll('p, h1, h2, h3, div').forEach(el => {
                if (!el.innerHTML.trim().replace(/<br>/gi, '')) {
                    el.remove();
                }
            });

            // Body kenarındaki <br> ve boşluk artıklarını temizle (paste sonrası oluşan baş/son <br>'ler)
            const isStripableEdge = n =>
                (n.nodeType === Node.ELEMENT_NODE && n.tagName === 'BR') ||
                (n.nodeType === Node.TEXT_NODE && n.textContent.trim() === '');
            while (body.firstChild && isStripableEdge(body.firstChild)) body.firstChild.remove();
            while (body.lastChild && isStripableEdge(body.lastChild)) body.lastChild.remove();

            let cleanedHtml = body.innerHTML;
            cleanedHtml = cleanedHtml.replace(/(<br\s*\/?>\s*){2,}/gi, '<br>');
            cleanedHtml = cleanedHtml.replace(/&nbsp;/g, ' ');

            return cleanedHtml.trim();
        }

        /**
         * Tablo yapısını editöryal HTML standardına çevirir:
         * - <colgroup>/<col> elementlerini siler (Word/Office paste artıkları)
         * - İlk <tr>'yi <thead>'e terfi ettirir, <td>'leri <th>'ye dönüştürür
         * - <td>/<th> içinde tek başına <p> varsa unwrap eder
         * - <th> içinde tek başına <strong> varsa unwrap eder (header zaten kalın)
         * - Hücre baş/sonundaki <br> ve whitespace artıklarını temizler
         */
        function normalizeTables(container, doc) {
            // A. <colgroup> ve <col> elementlerini sil
            container.querySelectorAll('colgroup, col').forEach(el => el.remove());

            // B. <thead> yoksa, ilk satırı <thead>'e terfi ettir; hücreleri <th>'ye çevir
            container.querySelectorAll('table').forEach(table => {
                if (table.querySelector('thead')) return;
                const firstRow = table.querySelector('tr');
                if (!firstRow) return;

                Array.from(firstRow.children).forEach(cell => {
                    if (cell.tagName !== 'TD' && cell.tagName !== 'TH') return;
                    const th = doc.createElement('th');
                    while (cell.firstChild) th.appendChild(cell.firstChild);
                    cell.parentNode.replaceChild(th, cell);
                });

                const tbody = firstRow.parentNode;
                const thead = doc.createElement('thead');
                thead.appendChild(firstRow);
                if (tbody && tbody.tagName === 'TBODY' && tbody.parentNode === table) {
                    table.insertBefore(thead, tbody);
                } else {
                    table.insertBefore(thead, table.firstChild);
                }
            });

            // D. Hücre baş/sonundaki <br> ve whitespace'i kırp (C'den ÖNCE çünkü tek <p> tespiti için temiz olmalı)
            const isCellStripable = n =>
                (n.nodeType === Node.ELEMENT_NODE && n.tagName === 'BR') ||
                (n.nodeType === Node.TEXT_NODE && n.textContent.trim() === '');
            container.querySelectorAll('td, th').forEach(cell => {
                while (cell.firstChild && isCellStripable(cell.firstChild)) cell.firstChild.remove();
                while (cell.lastChild && isCellStripable(cell.lastChild)) cell.lastChild.remove();
            });

            // C. <td>/<th> içinde tek <p> sarmalayıcısı varsa aç
            container.querySelectorAll('td, th').forEach(cell => {
                const elementChildren = Array.from(cell.children);
                if (elementChildren.length === 1 && elementChildren[0].tagName === 'P') {
                    const p = elementChildren[0];
                    while (p.firstChild) cell.insertBefore(p.firstChild, p);
                    p.remove();
                }
            });

            // C2. <th> içinde tek <strong> varsa aç (header zaten kalın render olur)
            container.querySelectorAll('th').forEach(cell => {
                const elementChildren = Array.from(cell.children);
                if (elementChildren.length === 1 && elementChildren[0].tagName === 'STRONG') {
                    const strong = elementChildren[0];
                    while (strong.firstChild) cell.insertBefore(strong.firstChild, strong);
                    strong.remove();
                }
            });
        }

        /**
         * <a href> taglerini external/internal ayrımına göre normalize eder:
         * - External (3. parti): target="_blank" + rel="nofollow noopener"
         *   (yeni sekmede aç + SEO juice geçirme + tabnabbing koruması)
         * - Internal (gameplus.com.tr, turkcell.com.tr, relative, anchor): target ve rel kaldırılır
         * - mailto:/tel:/javascript: → dokunulmaz
         */
        function normalizeLinks(container) {
            const INTERNAL_DOMAINS = ['gameplus.com.tr', 'turkcell.com.tr'];

            const isInternalHost = (host) => {
                host = host.toLowerCase();
                return INTERNAL_DOMAINS.some(d => host === d || host.endsWith('.' + d));
            };

            container.querySelectorAll('a[href]').forEach(a => {
                const href = a.getAttribute('href') || '';

                // Özel protokoller: dokunma
                if (/^(mailto:|tel:|javascript:|sms:)/i.test(href)) return;

                let isInternal = false;

                if (href === '' || href.startsWith('#')) {
                    // Boş veya anchor link → internal
                    isInternal = true;
                } else if (href.startsWith('//')) {
                    // Protokol-relative: //example.com/...
                    const host = href.slice(2).split('/')[0].split(':')[0];
                    isInternal = isInternalHost(host);
                } else if (href.startsWith('/') || !/^https?:\/\//i.test(href)) {
                    // Root-relative (/path) veya protokolsüz relative → internal
                    isInternal = true;
                } else {
                    // http(s)://...
                    try {
                        isInternal = isInternalHost(new URL(href).hostname);
                    } catch (e) {
                        isInternal = false;
                    }
                }

                if (isInternal) {
                    a.removeAttribute('target');
                    a.removeAttribute('rel');
                } else {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'nofollow noopener');
                }
            });
        }

        /**
         * Ardışık aynı türdeki liste elemanlarını (<ol>+<ol> veya <ul>+<ul>) birleştirir.
         * 
         * Kurallar:
         * - İki aynı türde liste arasında sadece p, div, br, boş text varsa → birleştir
         * - Aradaki p/div içeriği önceki <li>'nin içine taşınır
         * - Heading (h1-h6) veya başka yapısal eleman (table, blockquote vb.) 
         *   araya girerse → birleştirmeyi DURDUR (bunlar listenin parçası değil)
         */
        function mergeAdjacentLists(container) {
            const listTags = ['OL', 'UL'];
            // Heading'ler ve yapısal elemanlar: bunlar araya girerse birleştirme durur
            const STOP_TAGS = new Set(['H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'TABLE', 'BLOCKQUOTE', 'HR', 'SECTION', 'ARTICLE', 'NAV', 'ASIDE', 'HEADER', 'FOOTER']);
            // Ara içerik olarak <li> içine taşınabilecek elemanlar
            const ABSORBABLE_TAGS = new Set(['P', 'DIV', 'BR']);

            let changed = true;
            while (changed) {
                changed = false;
                for (const tag of listTags) {
                    const lists = Array.from(container.querySelectorAll(tag));
                    for (const list of lists) {
                        if (!list.parentNode) continue;

                        let cursor = list.nextSibling;
                        const intermediateNodes = [];
                        let foundNextList = null;
                        let hitStopper = false;

                        while (cursor) {
                            // Boş text node → topla, devam
                            if (cursor.nodeType === Node.TEXT_NODE && cursor.textContent.trim() === '') {
                                intermediateNodes.push(cursor);
                                cursor = cursor.nextSibling;
                                continue;
                            }

                            // Element node
                            if (cursor.nodeType === Node.ELEMENT_NODE) {
                                // Aynı türde liste bulduk → birleştirme hedefi
                                if (cursor.tagName === tag) {
                                    foundNextList = cursor;
                                    break;
                                }

                                // Heading veya yapısal eleman → DUR, birleştirme yapma
                                if (STOP_TAGS.has(cursor.tagName)) {
                                    hitStopper = true;
                                    break;
                                }

                                // Farklı türde liste (ol içinde ul veya tersi) → DUR
                                if (cursor.tagName === 'OL' || cursor.tagName === 'UL') {
                                    hitStopper = true;
                                    break;
                                }

                                // p, div, br → ara içerik olarak topla
                                if (ABSORBABLE_TAGS.has(cursor.tagName)) {
                                    intermediateNodes.push(cursor);
                                    cursor = cursor.nextSibling;
                                    continue;
                                }

                                // Tanımlanamayan başka element → güvenli tarafta kal, dur
                                hitStopper = true;
                                break;
                            }

                            // Anlamlı text node (element değil) → topla
                            if (cursor.nodeType === Node.TEXT_NODE && cursor.textContent.trim() !== '') {
                                intermediateNodes.push(cursor);
                                cursor = cursor.nextSibling;
                                continue;
                            }

                            break;
                        }

                        // Eğer stopper'a çarptıysak veya sonraki liste bulunamadıysa, geç
                        if (hitStopper || !foundNextList) continue;

                        // Aradaki gerçek içerik var mı?
                        const hasRealContent = intermediateNodes.some(n => {
                            if (n.nodeType === Node.ELEMENT_NODE && n.tagName !== 'BR') return true;
                            if (n.nodeType === Node.TEXT_NODE && n.textContent.trim() !== '') return true;
                            return false;
                        });

                        if (hasRealContent) {
                            // Aradaki içeriği birinci listenin son <li>'sine taşı
                            const lastLi = list.querySelector('li:last-child');
                            if (lastLi) {
                                for (const node of intermediateNodes) {
                                    lastLi.appendChild(node);
                                }
                            } else {
                                for (const node of intermediateNodes) {
                                    node.remove();
                                }
                            }
                        } else {
                            // Sadece boş node'lar → sil
                            for (const node of intermediateNodes) {
                                node.remove();
                            }
                        }

                        // İkinci listenin çocuklarını birinciye taşı
                        while (foundNextList.firstChild) {
                            list.appendChild(foundNextList.firstChild);
                        }
                        foundNextList.remove();
                        changed = true;
                        break;
                    }
                    if (changed) break;
                }
            }
        }
        
        function richTextToHtml() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const richHTML = richTextEditor.innerHTML;
                const cleanedOutputHTML = cleanHtmlForOutput(richHTML);
                htmlOutputEditor.value = cleanedOutputHTML;
            }, 350);
        }

        richTextEditor.addEventListener('input', richTextToHtml);

        richTextEditor.addEventListener('paste', (event) => {
            event.preventDefault();
            const pasteData = event.clipboardData || window.clipboardData;
            let pastedHtml = pasteData.getData('text/html');
            
            if (!pastedHtml || pastedHtml.trim() === '') {
                const plainText = pasteData.getData('text/plain');
                if (plainText) {
                    const sanitizedText = plainText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    pastedHtml = sanitizedText.split('\n').map(line => {
                        return `<p>${line.trim() === '' ? '<br>' : line}</p>`;
                    }).join('');
                } else {
                    pastedHtml = '';
                }
            }
            
            if (pastedHtml) {
                document.execCommand('insertHTML', false, pastedHtml);
            }
            
            setTimeout(richTextToHtml, 50); 
        });
        
        function fallbackCopy(text, button) {
            const originalText = button.textContent;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.top = '-9999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                button.textContent = '✅ Kopyalandı!';
            } catch (err) {
                console.error('Fallback kopyalama başarısız oldu', err);
                button.textContent = '❌ Hata';
            }
            document.body.removeChild(textArea);
            setTimeout(() => { button.textContent = originalText; }, 2000);
        }

        function copyHtmlOutput(event) { 
            const textToCopy = htmlOutputEditor.value;
            const btn = event.target;
            const originalText = btn.textContent;
            if (!navigator.clipboard) {
                fallbackCopy(textToCopy, btn);
                return;
            }
            navigator.clipboard.writeText(textToCopy).then(() => {
                btn.textContent = '✅ Kopyalandı!';
                setTimeout(() => { btn.textContent = originalText; }, 2000);
            }).catch(err => {
                console.warn('Clipboard API hatası, yedeğe geçiliyor.', err);
                fallbackCopy(textToCopy, btn);
            });
        }
        
        function copyRichTextContent(event) { 
            const textToCopy = htmlOutputEditor.value;
            const btn = event.target;
            const originalText = btn.textContent;
            if (!navigator.clipboard) {
                fallbackCopy(textToCopy, btn);
                return;
            }
            navigator.clipboard.writeText(textToCopy).then(() => {
                 btn.textContent = '✅ Kopyalandı!';
                 setTimeout(() => { btn.textContent = originalText; }, 2000);
            }).catch(err => {
                console.warn('Clipboard API hatası, yedeğe geçiliyor.', err);
                fallbackCopy(textToCopy, btn);
            });
        }

        function initializeEditor() {
            richTextEditor.innerHTML = '';
            richTextToHtml(); 
        }

        initializeEditor();
    </script>
</body>
